[project]
name = "ai-search-agent"
version = "0.1.0"
description = "Enterprise AI Search & Knowledge Discovery Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.2.0",
    "a2a-sdk>=0.3.0",
    "a2ui-agent-sdk>=0.6.0",
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-storage>=2.14.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "pillow>=10.2.0",
    "playwright>=1.63.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
